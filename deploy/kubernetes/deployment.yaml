apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-wheel-strategy
  labels:
    app: options-wheel-strategy
spec:
  replicas: 1  # Single instance for trading strategy
  selector:
    matchLabels:
      app: options-wheel-strategy
  template:
    metadata:
      labels:
        app: options-wheel-strategy
    spec:
      containers:
      - name: options-wheel
        image: options-wheel:latest
        imagePullPolicy: Always

        env:
        - name: ALPACA_API_KEY
          valueFrom:
            secretKeyRef:
              name: alpaca-credentials
              key: api-key
        - name: ALPACA_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: alpaca-credentials
              key: secret-key
        - name: ALPACA_PAPER_TRADING
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        - name: STRATEGY_MODE
          value: "scheduled"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: logs-volume
          mountPath: /app/logs

        # Health checks
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "from src.utils.config import Config; Config()"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "from src.utils.config import Config; Config()"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5

      volumes:
      - name: config-volume
        configMap:
          name: options-wheel-config
      - name: logs-volume
        emptyDir: {}

      # Security context
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Restart policy
      restartPolicy: Always

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: options-wheel-config
data:
  settings.yaml: |
    # Options Wheel Strategy Configuration

    # Alpaca API Settings
    alpaca:
      paper_trading: true
      api_key_id: "${ALPACA_API_KEY}"
      secret_key: "${ALPACA_SECRET_KEY}"

    # Trading Strategy Parameters
    strategy:
      put_target_dte: 7
      call_target_dte: 7
      put_delta_range: [0.10, 0.20]
      call_delta_range: [0.10, 0.20]
      min_put_premium: 0.50
      min_call_premium: 0.30
      min_stock_price: 20.00
      max_stock_price: 500.00
      min_avg_volume: 1000000

    # Risk Management
    risk:
      max_position_size: 0.10
      use_put_stop_loss: false
      use_call_stop_loss: true
      put_stop_loss_percent: 0.50
      call_stop_loss_percent: 0.50
      stop_loss_multiplier: 1.5

    # FC-069 S1 deleted this manifest's copies of the swept knobs:
    # max_positions_per_stock, max_total_positions, max_exposure_per_ticker
    # (which had already drifted to 50000 against settings.yaml's 40000 — itself
    # evidence nothing enforced it), max_portfolio_allocation, min_cash_reserve,
    # profit_target_percent, max_iv_rank / min_iv_rank, the whole
    # gap_risk_controls block, and the monitoring / logging blocks. Their
    # properties and validation no longer exist on Config.
    #
    # This manifest is NOT the deploy path — Cloud Run is — and it has drifted
    # from config/settings.yaml in several other places (universe, deltas,
    # stop-loss switches). Treat it as an archived example, not as config.

    # Stock Universe
    stocks:
      symbols:
        - "AAPL"
        - "MSFT"
        - "GOOGL"
        - "AMZN"
        - "TSLA"
        - "NVDA"
        - "AMD"
        - "QQQ"
        - "SPY"
        - "IWM"

---
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-credentials
type: Opaque
data:
  # Base64 encoded API credentials
  # Replace with your actual encoded credentials
  api-key: eW91cl9hcGlfa2V5X2hlcmU=
  secret-key: eW91cl9zZWNyZXRfa2V5X2hlcmU=

---
apiVersion: v1
kind: Service
metadata:
  name: options-wheel-service
spec:
  selector:
    app: options-wheel-strategy
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  type: ClusterIP