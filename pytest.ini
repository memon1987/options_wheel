[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    real_bq_lookup: exercises CallSeller's real BigQuery cost-basis fallback
    real_finnhub_fetch: exercises EarningsCalendarService._fetch_earnings against a mocked finnhub client (still no network)
